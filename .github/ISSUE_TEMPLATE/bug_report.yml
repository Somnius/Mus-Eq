name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options: [Docker, Podman, Bare metal, Android, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and client
      placeholder: Linux, browser (Firefox 140)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or errors. Remove tokens and private URLs first.
      render: shell
