name: Feature request
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, the solution second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Server and API, Web player, Android, Desktop client, Radio and streaming, Metadata and duplicates, Fetch, Skins, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you looked at
