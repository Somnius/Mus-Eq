name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/add-spdx.py --check
      - run: python3 scripts/check-licences.py
      - run: python3 -m unittest discover -s scripts
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
  deny:
    # An independent second opinion on licences, bans and sources from cargo-deny. The action is pinned to a commit
    # (v2.1.1); it builds a small container on a base image pinned by digest and downloads the prebuilt cargo-deny
    # release, so nothing is compiled. The blocking licence check that contributors run locally is
    # scripts/check-licences.py; this job cross-checks it against the real tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: licenses bans sources
  advisories:
    # Known vulnerabilities in dependencies. Reported but never blocking: a new advisory upstream must not fail
    # unrelated pushes. The blocking `deny` job runs the same pinned action, so a broken action setup would fail there.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@2.76.0 lint docs/openapi.yaml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  android:
    # Builds the debug app and runs its unit tests. The wrapper pins Gradle; the SDK platform and build
    # tools the app needs are installed here if the runner image does not already have them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK pieces
        run: |
          yes | timeout 120 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
        working-directory: android
  e2e:
    # Full local check, including the headless-browser smoke test (login, library, Webamp,
    # stations, session, remote commands). Uses the Chrome that ships on the runner.
    runs-on: ubuntu-latest
    env:
      CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/check.sh
