[package]
name = "museq-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
unicode-normalization = "0.1.26"
url = "2.5.8"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
