openapi: 3.1.0
info:
  title: MusEq API
  version: 0.1.0
  description: >-
    Draft v1 contract for the MusEq server. Contract first: clients are built
    against this file. Implemented: health, login/logout, tracks, audio, playlists, scan jobs, session, events, skins. Still draft: stations, radio, the other job kinds.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
  - cookie: []
tags:
  - name: system
  - name: library
  - name: playlists
  - name: session
  - name: stations
  - name: jobs
  - name: skins
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/login:
    post:
      tags: [system]
      operationId: login
      summary: Exchange the owner token for a session cookie (for browsers)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Cookie set }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "Too many failed logins in the last minute", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/logout:
    post:
      tags: [system]
      operationId: logout
      summary: End the browser session (the cookie id is revoked server-side). Needs auth like any mutation.
      responses:
        "204": { description: Cookie cleared }
  /v1/duplicates:
    get:
      tags: [library]
      operationId: listDuplicates
      summary: >-
        Groups of files that are the same recording: identical bytes, or the same audio
        (fingerprint match) in any format. Each group names the proposed keeper (lossless, then
        bitrate, then sample rate, then size) and the proof. Nothing is deleted.
      responses:
        "200":
          description: Groups still to be decided (merged ones are not listed again)
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  note: { type: string }
                  pending_comparisons: { type: integer, description: "Fingerprinted files not compared yet (run the fingerprint job)" }
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/DuplicateGroup" }
  /v1/duplicates/merge:
    post:
      tags: [library]
      operationId: mergeDuplicates
      summary: >-
        Join the given files under the track of the kept file. The files stay on disk and keep
        streaming; playlist entries of the absorbed tracks now point at the kept track.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids, keep_file_id]
              properties:
                file_ids: { type: array, minItems: 2, items: { type: string } }
                keep_file_id: { type: string, description: "One of file_ids; becomes the preferred file" }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  track_id: { type: string }
                  preferred_file_id: { type: string }
                  merged_files: { type: integer }
        "400": { description: "Fewer than two files, keep not in the list, or an invalid id", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/tracks/{id}/candidates:
    get:
      tags: [library]
      operationId: listCandidates
      summary: Suggested metadata for a track (from MusicBrainz or AcoustID), newest decisions last. Nothing is applied until a candidate is accepted.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Candidate" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/tracks/{id}/identify:
    post:
      tags: [library]
      operationId: identifyTrack
      summary: Identify a track by its audio through AcoustID and store the answers as candidates. Needs MUSEQ_ACOUSTID_KEY and a fingerprint.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: "How many candidates were found and stored" }
        "409": { description: "No fingerprint yet: run the fingerprint job", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: "No AcoustID key configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "AcoustID did not answer properly", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/candidates/{id}/accept:
    post:
      tags: [library]
      operationId: acceptCandidate
      summary: Apply a candidate to its track in the database (title, artist, album; a field the candidate lacks keeps the track's value). Audio files are never rewritten, and a rescan keeps the correction.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Applied }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already accepted, rejected or superseded", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/candidates/{id}/reject:
    post:
      tags: [library]
      operationId: rejectCandidate
      summary: Dismiss a pending candidate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Rejected }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/tracks:
    get:
      tags: [library]
      operationId: searchTracks
      summary: Search the library
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching tracks
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/tracks/{id}:
    get:
      tags: [library]
      operationId: getTrack
      summary: One track
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The track
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Track" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/audio/{file_id}:
    get:
      tags: [library]
      operationId: getAudio
      summary: Stream a file by file id (supports HTTP Range). codec/kbps are not implemented before phase 5 (501).
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string }
        - name: codec
          in: query
          schema: { type: string, enum: [opus, mp3, aac] }
        - name: kbps
          in: query
          schema: { type: integer, minimum: 32, maximum: 320 }
      responses:
        "200":
          description: Audio bytes
          content:
            audio/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial content
        "501":
          description: codec/kbps requested before transcoding exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: List playlists
      responses:
        "200":
          description: Playlists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Playlist" }
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                extend: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
  /v1/playlists/{id}:
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: One playlist with its ordered track ids
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete a playlist
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/playlists/{id}/extend:
    post:
      tags: [playlists]
      operationId: extendPlaylist
      summary: >-
        Append tracks in the same style (shared genre) by artists that are not in the playlist yet,
        one track per new artist, from the local library only. Says so when the pool is empty.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 20, default: 3 }
      responses:
        "200":
          description: The tracks that were added (possibly none, with the reason)
          content:
            application/json:
              schema:
                type: object
                required: [added, pool_empty]
                properties:
                  added:
                    type: array
                    items: { $ref: "#/components/schemas/Track" }
                  pool_empty: { type: boolean }
                  available_artists: { type: integer }
                  reason: { type: string }
        "400": { description: "count out of range", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The playlist is empty", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/playlists/{id}/items:
    put:
      tags: [playlists]
      operationId: setPlaylistItems
      summary: Replace the whole item list (this is how clients remove and reorder)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_ids]
              properties:
                track_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The playlist after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [playlists]
      operationId: addPlaylistItem
      summary: Append a track
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id: { type: string }
      responses:
        "204": { description: Added }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Now-playing state (what widgets and other apps read)
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    post:
      tags: [session]
      operationId: postSession
      summary: >-
        Two uses. `report`: the playing client says what it is doing (it becomes the session's client).
        `play|pause|next|previous|volume`: a command from a widget or another client, forwarded over
        /v1/events to the client that last reported. Commands answer 409 when no player is connected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [report, play, pause, next, previous, volume], description: "play may carry track_id or station_id (not both) to start something" }
                client_id: { type: string, maxLength: 64, description: Required for report }
                state: { type: string, enum: [stopped, playing, paused] }
                track_id: { type: string }
                station_id: { type: string, description: "Report a station instead of a track; with play, start that station" }
                position_ms: { type: integer, minimum: 0 }
                volume: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Report stored; the new session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "202":
          description: Command forwarded to the playing client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No player is connected (the client that last reported has no open /v1/events socket with its client_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/events:
    get:
      tags: [session]
      operationId: events
      summary: WebSocket upgrade. Players pass ?client_id= so commands can be checked against live connections. Sends a session snapshot, then {type:session} and {type:command,target} messages. A browser Origin that differs from Host is refused (403).
      responses:
        "101": { description: Switching protocols }
  /v1/stations:
    get:
      tags: [stations]
      operationId: listStations
      summary: List stations. External stations carry the upstream url and are played by the client directly, never proxied.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Case- and accent-insensitive name search" }
        - { name: category, in: query, schema: { type: string }, description: "Music, News, Sports or Other (case-insensitive; anything else counts as Other)" }
        - { name: alive, in: query, schema: { type: string, enum: ["true", "false", unknown] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Stations
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Station" }
                  total: { type: integer }
        "400": { description: "Bad filter value", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [stations]
      operationId: addStation
      summary: Add a station by stream URL (http or https only, with a host, no credentials in the URL). Loopback, private and link-local addresses are refused unless the server runs with MUSEQ_ALLOW_PRIVATE_STATIONS=1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 200 }
                url: { type: string }
                category: { type: string, enum: [Music, News, Sports, Other] }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "400": { description: "Bad name or URL", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "A station with that URL exists", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/stations/{id}:
    get:
      tags: [stations]
      operationId: getStation
      summary: One station
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The station
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [stations]
      operationId: deleteStation
      summary: Remove a station
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/radio/{id}.{ext}:
    get:
      tags: [stations]
      operationId: getRadioStream
      summary: Icecast-style chunked stream of a library or live station (never external)
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: ext
          in: path
          required: true
          schema: { type: string, enum: [ogg, mp3, aac] }
      responses:
        "200":
          description: Endless audio stream
          content:
            audio/*:
              schema: { type: string, format: binary }
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Start a background job (fetch is refused unless enabled in config)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [scan, check_stations, fetch, tag, fingerprint] }
                input:
                  type: object
                  additionalProperties: true
                  description: "For fetch: `{\"url\": \"…\"}`, one https link to a single YouTube/YouTube Music video or a single Spotify track (playlists and albums are refused)"
                  properties:
                    url: { type: string, format: uri }
                track_ids: { type: array, items: { type: string }, description: "For tag: only these tracks (default: tracks with a missing artist or album)" }
      responses:
        "202":
          description: Accepted. A finished fetch job has `result.outcome` = imported (with file_id, track_id, title, artist, album, video_id) or skipped (the video was already fetched)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          description: The same kind of job is already running (scan, fingerprint and fetch also exclude each other)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { description: "Unknown job kind, or (fetch) a link that is not a supported single-track https URL", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403":
          description: Job kind disabled by configuration (fetch is off by default; the message says what is missing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job state
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/fetch/status:
    get:
      tags: [jobs]
      operationId: fetchStatus
      summary: Whether fetching is enabled, and why not if it is not
      responses:
        "200":
          description: Fetch configuration state (never contains paths to cookies or any secret)
          content:
            application/json:
              schema:
                type: object
                required: [enabled, needs_ack]
                properties:
                  enabled: { type: boolean }
                  reason: { type: [string, "null"], description: "Why it is off (null when enabled)" }
                  needs_ack: { type: string, description: "The exact sentence MUSEQ_FETCH_ACK must carry" }
  /v1/skins/{id}:
    get:
      tags: [skins]
      operationId: getSkin
      summary: Download a stored .wsz (id is the 16-hex-character id from the list)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The raw skin file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/skins:
    get:
      tags: [skins]
      operationId: listSkins
      summary: List uploaded .wsz skins
      responses:
        "200":
          description: Skins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skin" }
    post:
      tags: [skins]
      operationId: uploadSkin
      summary: Upload a .wsz skin (raw zip body, at most 8 MiB, never unpacked by the server). Optional ?name=.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skin" }
        "400": { description: "Not a zip file", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: "Larger than 8 MiB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: museq_token
      description: Set by POST /v1/login (HttpOnly, SameSite=Strict). With cookie auth, mutating requests must be application/json or application/octet-stream (415 otherwise).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such object
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    Track:
      type: object
      required: [id, title, preferred_file_id]
      properties:
        id: { type: string }
        title: { type: string }
        genre: { type: [string, "null"] }
        artist: { type: [string, "null"] }
        album: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"] }
        preferred_file_id: { type: string }
    Playlist:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        extend: { type: boolean }
        track_ids:
          type: array
          items: { type: string }
    Session:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [stopped, playing, paused] }
        track: { oneOf: [{ $ref: "#/components/schemas/Track" }, { type: "null" }] }
        station: { oneOf: [{ $ref: "#/components/schemas/Station" }, { type: "null" }], description: "Set while a station plays (id, name, category, url)" }
        position_ms: { type: integer }
        volume: { type: number }
        client_id: { type: [string, "null"], description: The client that last reported }
    Station:
      type: object
      required: [id, name, kind, category, url, source]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [external] , description: "library and live stations arrive with phases 5 and 6" }
        category: { type: string, enum: [Music, News, Sports, Other] }
        url: { type: string, format: uri }
        source: { type: string, description: "Where it came from: manual, or the name of the seed list file (for example trayfm or museq)" }
        alive: { type: [boolean, "null"], description: "null = never checked" }
        checked_at: { type: [integer, "null"], description: "Unix seconds of the last liveness check" }
        error: { type: [string, "null"], description: "Why the last check failed" }
    Job:
      type: object
      required: [id, kind, state]
      properties:
        id: { type: string }
        kind: { type: string, enum: [scan, check_stations, fetch, tag, fingerprint] }
        state: { type: string, enum: [queued, running, done, failed] }
        attempts: { type: integer }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        result_track_id: { type: string }
    Candidate:
      type: object
      properties:
        id: { type: string }
        track_id: { type: string }
        source: { type: string, enum: [musicbrainz, acoustid] }
        score: { type: [number, "null"], description: "0-100" }
        title: { type: [string, "null"] }
        artist: { type: [string, "null"] }
        album: { type: [string, "null"] }
        year: { type: [string, "null"] }
