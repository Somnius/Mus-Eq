<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mus-Eq</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="login" hidden>
    <form id="login-form">
      <h1>Mus-Eq</h1>
      <input id="token" type="password" placeholder="Owner token" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" role="alert"></p>
    </form>
  </div>
  <main id="app" hidden>
    <section id="library">
      <header>
        <h1>Mus-Eq</h1>
        <input id="search" type="search" placeholder="Search title, artist, album">
        <button id="scan" type="button">Rescan library</button>
        <button id="logout" type="button">Sign out</button>
      </header>
      <p id="status" role="status"></p>
      <ul id="tracks"></ul>
      <section id="playlists">
        <h2>Playlists</h2>
        <div class="row">
          <input id="pl-name" type="text" placeholder="New playlist name">
          <label><input id="pl-extend" type="checkbox" checked> add new artists in the same style when it ends</label>
          <button id="pl-create" type="button">Create</button>
        </div>
        <label>Library "+" buttons add to: <select id="pl-target"></select></label>
        <p id="pl-status" role="status"></p>
        <ul id="pl-list"></ul>
      </section>
      <section id="stations">
        <h2>Radio stations</h2>
        <div class="row">
          <input id="st-search" type="search" placeholder="Search stations">
          <select id="st-cat" aria-label="Category">
            <option value="">All</option><option>Music</option><option>News</option><option>Sports</option><option>Other</option>
          </select>
          <label><input id="st-live" type="checkbox"> live only</label>
          <button id="st-check" type="button">Check streams</button>
        </div>
        <p id="st-status" role="status"></p>
        <audio id="st-audio" controls preload="none"></audio>
        <ul id="st-list"></ul>
      </section>
      <details id="skins">
        <summary>Skins</summary>
        <ul id="skin-list"></ul>
        <label>Upload a .wsz skin <input id="skin-file" type="file" accept=".wsz,.zip"></label>
      </details>
    </section>
    <div id="webamp"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
