<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mus-Eq logo: an equalizer with five segmented bars">
  <title>Mus-Eq</title>
  <defs>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="206" x2="0" y2="36">
      <stop offset="0" stop-color="#2e9e4f"/>
      <stop offset="0.6" stop-color="#8bd450"/>
      <stop offset="1" stop-color="#f2d64b"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2128"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2c323b"/>
  <!-- five equalizer bars, drawn as dashed strokes so they look like LED segments -->
  <g stroke="url(#bar)" stroke-width="28" stroke-dasharray="14 5" fill="none">
    <line x1="52"  y1="206" x2="52"  y2="140"/>
    <line x1="90"  y1="206" x2="90"  y2="88"/>
    <line x1="128" y1="206" x2="128" y2="50"/>
    <line x1="166" y1="206" x2="166" y2="112"/>
    <line x1="204" y1="206" x2="204" y2="160"/>
  </g>
  <!-- peak markers -->
  <g fill="#e8e8e8">
    <rect x="38"  y="126" width="28" height="5" rx="2"/>
    <rect x="76"  y="74"  width="28" height="5" rx="2"/>
    <rect x="114" y="36"  width="28" height="5" rx="2"/>
    <rect x="152" y="98"  width="28" height="5" rx="2"/>
    <rect x="190" y="146" width="28" height="5" rx="2"/>
  </g>
</svg>
